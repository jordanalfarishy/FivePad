org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# JDK bawaan mesin ini adalah 24, sementara Android Gradle Plugin butuh 21.
# Di-pin di sini supaya build tidak bergantung pada JAVA_HOME shell dan
# tidak mengganggu pekerjaan lain yang memang memakai JDK 24.
org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-21.jdk/Contents/Home
